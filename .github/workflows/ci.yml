name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: sort_game

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show Python version
        run: python --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          sudo apt-get update
          sudo apt-get install -y default-mysql-client

      - name: Build C++ engine
        run: |
          g++ -std=c++17 cpp_engine/sort_engine.cpp cpp_engine/algorithms/*.cpp -O2 -o cpp_engine/sort_engine

      - name: Wait for MySQL
        run: |
          until mysql -h 127.0.0.1 -P 3306 -u test_user -ptest_password -e "SELECT 1" test_db; do
            echo "waiting for mysql..."
            sleep 3
          done

      - name: Apply schema
        run: |
          mysql -h 127.0.0.1 -P 3306 -u test_user -ptest_password test_db < database/schema/01_schema.sql

      - name: Apply seed
        run: |
          mysql -h 127.0.0.1 -P 3306 -u test_user -ptest_password test_db < database/seed/02_seed.sql

      - name: Run pytest with coverage
        env:
          FLASK_ENV: testing
          PYTHONPATH: .
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: test_db
          DB_USER: test_user
          DB_PASSWORD: test_password
        run: |
          pytest --maxfail=1 --disable-warnings --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: sort_game/coverage.xml

      - name: Build Docker image
        run: |
          docker build -f docker/app/Dockerfile -t sort-game:test .
